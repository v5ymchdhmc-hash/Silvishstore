<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILVISH STORE</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: sans-serif; }
        header {
            padding: 18px 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #222;
            background: #0f0f0f;
        }
        header img.logo {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #c0c0c0;
        }
        header .brand-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #f5f5f5;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 25px;
            max-width: 1100px;
            margin: auto;
        }
        .card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
        }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .card-body { padding: 15px; }
        h3 { font-size: 16px; margin: 0 0 8px 0; }
        .price { color: #d4af37; font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #d4af37; }
        #canvas-container { width: 100%; height: 180px; }

        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #d4af37;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: left;
        }
        .modal-content h2 { margin-top: 0; color: #d4af37; font-size: 18px; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px;
            flex: 1;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-confirm {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 10px;
            flex: 2;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <header>
        <img src="logo.jpg" alt="SILVISH STORE Logo" class="logo">
        <span class="brand-title">SILVISH STORE</span>
    </header>

    <div id="canvas-container"></div>
    <div class="product-grid" id="store
